name: Universal Discord Notifier

on:
  workflow_call:
    inputs:
      title:
        description: 'Notification Title'
        required: false
        type: string
      message:
        description: 'Notification Message Body'
        required: false
        type: string
      status:
        description: 'Workflow Status (success, failure, cancelled)'
        required: false
        type: string
        default: 'success'
      target_url:
        description: 'Target URL to display (e.g. Deployed Page URL)'
        required: false
        type: string
    secrets:
      DISCORD_WEBHOOK:
        required: true

jobs:
  notify_discord:
    runs-on: ubuntu-latest
    steps:
      - name: Set Notification Content
        id: content
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # デフォルト値を設定
          TITLE="🔔 Workflow Notification"
          DESCRIPTION=""
          SEVERITY="info"
          WEBHOOK_URL="${{ secrets.DISCORD_WEBHOOK }}"

          # Title logic
          if [ -n "${{ inputs.title }}" ]; then
            TITLE="${{ inputs.title }}"
          else
            TITLE="🔔 Workflow完了: ${{ github.workflow }}"
          fi

          # Message logic
          if [ -n "${{ inputs.message }}" ]; then
            DESCRIPTION="${{ inputs.message }}"
          else
            DESCRIPTION="**リポジトリ:** ${{ github.repository }}\n**ブランチ:** ${{ github.ref_name }}\n[実行詳細を見る](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})"
          fi

          # Target URL
          if [ -n "${{ inputs.target_url }}" ]; then
            DESCRIPTION="${DESCRIPTION}\n**添付リンク:** [ページを開く](${{ inputs.target_url }})"
          fi

          # Check for PR context and append (if triggered by PR)
          PR_URL="${{ github.event.pull_request.html_url }}"

          # Fallback: Search for PR associated with the commit if not found in context
          if [ -z "$PR_URL" ] || [ "$PR_URL" == "null" ]; then
             echo "PR URL not found in context. Searching via GitHub CLI for commit ${{ github.sha }}..."
             # Search for merged PRs containing this SHA
             SEARCH_RESULT=$(gh pr list --repo "${{ github.repository }}" --search "${{ github.sha }} is:merged" --state merged --json url --jq '.[0].url' || echo "")
             if [ -n "$SEARCH_RESULT" ]; then
                PR_URL="$SEARCH_RESULT"
                echo "Found associated PR: $PR_URL"
             else
                echo "No associated PR found."
             fi
          fi

          if [ -n "$PR_URL" ] && [ "$PR_URL" != "null" ]; then
              DESCRIPTION="${DESCRIPTION}\n**PR:** [Pull Requestを見る]($PR_URL)"
          fi

          # Status/Severity
          case "${{ inputs.status }}" in
            "success") SEVERITY="info" ;;
            "failure") SEVERITY="error" ;;
            *) SEVERITY="warn" ;;
          esac

          # GITHUB_OUTPUT に書き出し (改行を含むテキストの対応)
          echo "title=$TITLE" >> $GITHUB_OUTPUT

          # output multiline string
          EOF=$(dd if=/dev/urandom bs=15 count=1 status=none | base64)
          echo "description<<$EOF" >> $GITHUB_OUTPUT
          echo -e "$DESCRIPTION" >> $GITHUB_OUTPUT
          echo "$EOF" >> $GITHUB_OUTPUT

          echo "severity=$SEVERITY" >> $GITHUB_OUTPUT

      - name: Discordに通知を送信
        uses: rjstone/discord-webhook-notify@v2
        with:
          webhookUrl: ${{ secrets.DISCORD_WEBHOOK }}
          username: GitHub (Actions)
          avatarUrl: "https://github.githubassets.com/assets/GitHub-Mark-ea2971cee799.png"
          title: ${{ steps.content.outputs.title }}
          description: ${{ steps.content.outputs.description }}
          severity: ${{ steps.content.outputs.severity }}
