name: Deploy to GitHub Pages

on:
  workflow_call:
    inputs:
      build_target_name:
        description: 'Build target name passed to build-unity.yml'
        required: false
        type: string
        default: 'For_GitHub_Pages'
    outputs:
      url:
        value: ${{ jobs.deploy.outputs.page_url }}
        description: "The URL of the deployed page"

  workflow_dispatch:
    inputs:
      build_target_name:
        description: 'Build target name passed to build-unity.yml'
        required: true
        type: choice
        options:
          - For_GitHub_Pages
          - WebGL
        default: 'For_GitHub_Pages'

jobs:
  build-webgl:
    uses: ./.github/workflows/build-unity.yml
    secrets: inherit
    with:
      build_target_name: ${{ inputs.build_target_name }}

  deploy:
    runs-on: ubuntu-latest
    needs: build-webgl

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
