name: Push Build To Other Repository

on:
  workflow_call:
    inputs:
      artifact_name:
        required: true
        type: string
      repository_path:
        required: true
        type: string
      target_dir:
        description: "example: build/unity"
        required: true
        type: string
      version_tag:
        required: true
        type: string
      run_id:
        required: false
        type: string

    secrets:
      DEPLOY_REPO_SECRET_KEY:
        required: true

jobs:
  deploy:
    name: Push ${{ inputs.artifact_name }} to ${{ inputs.repository_path }}/${{ inputs.target_dir }}
    runs-on: ubuntu-latest
    env:
      ARTIFACT_NAME: ${{ inputs.artifact_name }}
      VERSION_TAG: ${{ inputs.version_tag }}

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: build
          run-id: ${{ inputs.run_id }}

      - name: Checkout target repository
        uses: actions/checkout@v5
        with:
          repository: ${{ inputs.repository_path }}
          ssh-key: ${{ secrets.DEPLOY_REPO_SECRET_KEY }}
          path: target-repo

      - name: Copy build files to {{ inputs.target_dir }}
        run: |
          deploy_dir=target-repo/${{ inputs.target_dir }}/${GITHUB_REPOSITORY#${GITHUB_REPOSITORY_OWNER}/}
          mkdir -p ${deploy_dir}
          rm -rf ${deploy_dir}/*
          cp -r build/*/* ${deploy_dir}

      # 4. 変更をコミットしてプッシュ
      - name: Commit and push changes
        run: |
          cd target-repo
          git config --global user.name 'GitHub Actions Bot'
          git config --global user.email 'github-actions-bot@users.noreply.github.com'

          # 変更があるかチェック
          if [ -z "$(git status --porcelain)" ]; then
            echo "No changes to commit."
            exit 0
          fi

          git add .
          git commit -m "release(unity): Release ${{ env.VERSION_TAG }} "
          git push
