name: Test

on:
  workflow_dispatch: {}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check disk usage by folder
        run: |
            echo "--- Checking overall disk space:"
            df -h
            echo "--- Checking size of top-level directories:"
            # /mnt と /proc は仮想ファイルシステムなので除外
            sudo du -sh --exclude=/mnt --exclude=/proc /*
      - name: remove
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 512
          swap-size-mb: 1024
          remove-dotnet: 'true'
