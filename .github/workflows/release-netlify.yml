name: Release WebGL Build To Netlify

on:
  pull_request:
    branches:
      - main
    types: [closed]

jobs:
  call_build_webgl:
    name: Build WebGL
    # マージ、ブランチ名がrelease/*、labelsにrelease/WebGLがある
    if: >
      github.event.pull_request.merged == true &&
      startsWith(github.event.pull_request.head.ref, 'release/') == true &&
      contains(github.event.pull_request.labels.*.name, 'release/WebGL')
    uses: ./.github/workflows/build-unity.yml
    secrets: inherit
    with:
      build_target_name: WebGL

  deploy:
    name: Deploy to Netlify
    needs: call_build_webgl
    uses: ./.github/workflows/push-build-to-other-repo.yml
    secrets: inherit
    with:
      artifact_name: ${{ needs.call_build_webgl.outputs.artifact_name }}
      repository_path: epen3420/epen_page
