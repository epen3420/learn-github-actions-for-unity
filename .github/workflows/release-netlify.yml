name: Release WebGL To Netlify

on:
  workflow_dispatch: {}
  # pull_request:
  #   branches:
  #     - main
  #   types: [closed]

jobs:
  call_build_webgl:
    name: Build
    # if: >
    #   github.event.pull_request.merged == true &&
    #   contains(github.event.pull_request.labels.*.name, 'release')
    uses: ./.github/workflows/build-webgl.yml # ここを書き換えればビルドのメソッドを変えられる
    secrets: inherit

  deploy:
    name: Deploy to Netlify
    runs-on: ubuntu-latest
    needs: call_build_webgl
    env:
      ARTIFACT_NAME: ${{ needs.call_build_webgl.outputs.artifact_name }}

    steps:
    # Builder で出力した WebGL ビルドをダウンロード
    - name: Download artifact
      uses: actions/download-artifact@v4
      with:
        name: ${{ env.ARTIFACT_NAME }}
        path: build

    # ダウンロードしたビルドファイルをNetlifyへDeploy
    - name: Checkout Next.js repository
      uses: actions/checkout@v4
      with:
        # ★★★ ここにNext.jsリポジトリのSSH URLを指定 ★★★
        repository: git@github.com:epen3420/epen_page.git
        ssh-key: ${{ secrets.DEPLOY_KEY_FOR_NEXTJS_REPO }}
        path: nextjs-repo
        # lfs: true

    # 3. Next.js リポジトリの public/unity/ にファイルを上書きコピー
    - name: Copy build files to public/unity
      run: |
        # コピー先のフォルダを作成（存在しない場合）
        mkdir -p nextjs-repo/public/unity/${GITHUB_REPOSITORY#${GITHUB_REPOSITORY_OWNER}/}
        # フォルダの中身を一度削除（古いビルドを残さないため）
        rm -rf nextjs-repo/public/unity/${GITHUB_REPOSITORY#${GITHUB_REPOSITORY_OWNER}/}/*
        # ダウンロードしたビルド成果物（webgl-buildの中身）をコピー
        # （'webgl-build' フォルダには 'Build' と 'TemplateData' が入っている想定）
        cp -r webgl-build/* nextjs-repo/public/unity/${GITHUB_REPOSITORY#${GITHUB_REPOSITORY_OWNER}/}

    # 4. 変更をコミットしてプッシュ
    - name: Commit and push changes
      run: |
        cd nextjs-repo
        git config --global user.name 'GitHub Actions Bot'
        git config --global user.email 'github-actions-bot@users.noreply.github.com'

        # 変更があるかチェック
        if [ -z "$(git status --porcelain)" ]; then
          echo "No changes to commit."
          exit 0
        fi

        git add .
        git commit -m "chore(unity): Update WebGL build [skip ci]"
        git push
