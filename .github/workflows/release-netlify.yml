name: Release WebGL To Netlify

on:
  workflow_dispatch: {}
  # pull_request:
  #   branches:
  #     - main
  #   types: [closed]

jobs:
  call_build_webgl:
    name: Build
    # if: >
    #   github.event.pull_request.merged == true &&
    #   contains(github.event.pull_request.labels.*.name, 'release')
    uses: ./.github/workflows/build-webgl.yml # ここを書き換えればビルドのメソッドを変えられる
    secrets: inherit

  deploy:
    name: Deploy to Netlify
    runs-on: ubuntu-latest
    needs: call_build_webgl
    env:
      ARTIFACT_NAME: ${{ needs.call_build_webgl.outputs.artifact_name }}

    steps:
    # Builder で出力した WebGL ビルドをダウンロード
    - name: Download artifact
      uses: actions/download-artifact@v4
      with:
        name: ${{ env.ARTIFACT_NAME }}
        path: build

    # ダウンロードしたビルドファイルをNetlifyへDeploy
    - name: Deploy to Netlify
      uses: netlify/actions/cli@master
      env:
        NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
        NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID_FOR_DEV }}
      with:
        args: deploy --dir=build --prod
