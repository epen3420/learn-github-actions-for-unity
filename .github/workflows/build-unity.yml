name: Unity Build (Windows/WebGL)

on:
  workflow_dispatch:
    inputs:
      build_target_name:
        description: 'Choose Windows or WebGL'
        required: true
        type: choice
        options:
          - Windows
          - WebGL
        default: 'Windows'

  workflow_call:
    inputs:
      build_target_name:
        description: 'Choose Windows or WebGL'
        required: true
        type: string

    secrets:
      UNITY_EMAIL:
        required: true
      UNITY_PASSWORD:
        required: true
      UNITY_LICENSE:
        required: true

    outputs:
      artifact_name:
        description: "The name of the build artifact"
        value: ${{ jobs.build.outputs.artifact_name }}

jobs:
  build:
    name: Run the build for ${{ inputs.build_target_name }}
    runs-on: ubuntu-latest

    outputs:
      artifact_name: ${{ steps.vars.outputs.artifact_name }}

    steps:
      # 仮想環境にクローン
      - name: Check out my unity project
        uses: actions/checkout@v4
        with:
          lfs: true

      # ビルドターゲットに応じて環境変数を設定
      - name: Set Build Variables
        id: vars # ジョブの outputs で参照するため id を設定
        run: |
          echo "Setting build variables based on input: ${{ inputs.build_target_name }}"

          # inputs.build_target_name に応じて build_target (プラットフォーム名) を設定
          if [ "${{ inputs.build_target_name }}" == "Windows" ]; then
            echo "build_target=StandaloneWindows64" >> $GITHUB_ENV
            echo "build_custom_parameters=''" >> $GITHUB_ENV

          elif [ "${{ inputs.build_target_name }}" == "WebGL" ]; then
            echo "build_target=WebGL" >> $GITHUB_ENV
            echo "build_custom_parameters<<EOF" >> $GITHUB_ENV
            echo "-webglDecompressionFallback true" >> $GITHUB_ENV
            echo "-webglDataCaching true" >> $GITHUB_ENV
            echo "EOF" >> $GITHUB_ENV
          else
            echo "Error: Invalid build_target_name."
            exit 1
          fi

          # ARTIFACT_NAME を設定
          # GITHUB_ENV への書き込みはジョブ内で即時有効になる
          ARTIFACT_NAME_VALUE="${{ inputs.build_target_name }}-Build-$(git rev-parse --short HEAD)"
          echo "ARTIFACT_NAME=${ARTIFACT_NAME_VALUE}" >> $GITHUB_ENV

          # ジョブの outputs 用にアーティファクト名を出力
          echo "artifact_name=${ARTIFACT_NAME_VALUE}" >> $GITHUB_OUTPUT

      # Unityビルドの前にランナーの空き容量を確保する
      - name: Free Disk Space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true # node.jsを使う場合はfalse
          android: false # androidビルドの場合はfalse
          dotnet: true
          haskell: true
          docker-images: false
          swap-storage: true
          large-packages: false

      # 次の起動時の高速化のためライブラリをキャッシュ
      - name: Cache Library
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-

      - name: Cache Emscripten
        uses: actions/cache@v4
        with:
          path: ~/.emscripten_cache
          key: emscripten-${{ runner.os }}-${{ env.UNITY_VERSION }}


      - name: Cache Unity Packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/unity3d
          key: UPM-${{ runner.os }}-${{ hashFiles('Packages/manifest.json', 'Packages/packages-lock.json') }}

      - name: Cache UPM
        uses: actions/cache@v4
        with:
          path: ~/.cache/unity3d/PackageManager
          key: ${{ runner.os }}-upm-cache-${{ hashFiles('Packages/packages-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-upm-cache-


      # Unity ビルド実行
      - name: Run the build
        uses: game-ci/unity-builder@v4
        env:
          # 受け取ったシークレットを使う
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
        with:
          # Set Build Variables ステップで設定した環境変数を参照
          targetPlatform: ${{ env.build_target }}
          allowDirtyBuild: true
          customParameters: ${{ env.build_custom_parameters }}

      # ビルド成果物をアップロード
      - name: Upload the Build
        uses: actions/upload-artifact@v4
        with:
          # Set Build Variables ステップで設定した環境変数を参照
          name: ${{ env.ARTIFACT_NAME }}
          path: build/${{ env.build_target }}
      - name: a
        run: |
          echo $(df -h)
