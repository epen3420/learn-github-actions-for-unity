name: Windows Build

on:
  workflow_dispatch: {}
  workflow_call:
    # 呼び出し元にアーティファクト名を返す設定
    outputs:
      artifact_name:
        description: "The name of the build artifact"
        value: Windows-Build-${{ jobs.pre-build.outputs.build_id }}
    # 呼び出し元からシークレットを受け取る設定
    secrets:
      UNITY_EMAIL:
        required: true
      UNITY_PASSWORD:
        required: true
      UNITY_LICENSE:
        required: true

jobs:
  pre-build:
    uses: ./.github/workflows/pre-build.yml

  build:
    name: Run the Windows build
    runs-on: ubuntu-latest
    needs: pre-build

    steps:
      # 仮想環境にUnity Projectを入れる
      - name: Check out my unity project.
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Run the Windows build
        uses: game-ci/unity-builder@v4
        env:
          # 受け取ったシークレットを使う
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
        with:
          targetPlatform: StandaloneWindows64

      - name: Upload the Windows Build
        uses: actions/upload-artifact@v4
        with:
          name: ${{ needs.pre-build.outputs.build_id }}
          path: build
