name: Create Release

on:
  pull_request:
    branches:
      - main
    types: [closed]

jobs:
  call_build:
    name: Build (Windows)
    if: >
      github.event.pull_request.merged == true &&
      contains(github.event.pull_request.labels.*.name, 'release')
    uses: ./.github/workflows/build-windows.yml # ここを書き換えればビルドのメソッドを変えられる
    secrets: inherit

  create_release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: call_build

    steps:
      - name: Check pr name
        if: startsWith(github.event.pull_request.head.ref, 'release/') == false
        run: echo "PR name is invalid. Please rename release/"

      - name: Set env variables
        run: |
          echo "ARTIFACT_NAME=${{ needs.call_build.outputs.artifact_name }}" >> $GITHUB_ENV
          echo "VERSION_TAG=${{ github.event.pull_request.head_ref }} | sed 's/release\///'" >> $GITHUB_ENV
          echo "ZIP_FILE_NAME=${{ github.event.repository.name }}-${{ env.VERSION_TAG }}.zip" >> $GITHUB_ENV

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: ${{ env.ARTIFACT_NAME }}

      - name: Zip build files
        run: zip -r ${{ env.ZIP_FILE_NAME }} ./${{ env.ARTIFACT_NAME }}

      - name: Create Release
        id: create_release
        uses: softprops/action-gh-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: v${{ env.VERSION_TAG }}
          release_name: Release ${{ env.VERSION_TAG }}
          generate_release_notes: true

      - name: Upload Release Asset
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ./${{ env.ZIP_FILE_NAME }}
          asset_name: ${{ env.ZIP_FILE_NAME }}
          asset_content_type: application/zip
